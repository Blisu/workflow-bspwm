[colors]
background = #000000
foreground = #ffffff
foreground-alt = #aaaaaa
focused-bg = #ffffff
focused-fg = #000000
occupied-fg = #dddddd
empty-fg = #888888
alert = #ffffff

[bar/main]
width = 100%
height = 22pt
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0
border-size = 0

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "monospace:size=10;2"

modules-left = bspwm
modules-center = date
modules-right = cpu memory root volume backlight

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/bspwm]
type = internal/bspwm

# Focused workspace: Pure white background with black text
label-focused = %name%
label-focused-background = ${colors.focused-bg}
label-focused-foreground = ${colors.focused-fg}
label-focused-padding = 1

# Occupied workspace: Light gray text on pitch black
label-occupied = %name%
label-occupied-foreground = ${colors.occupied-fg}
label-occupied-padding = 1

# Urgent workspace: Inverse highlight
label-urgent = %name%!
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1

# Empty workspace: Soft gray for clear visibility
label-empty = %name%
label-empty-foreground = ${colors.empty-fg}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.foreground-alt}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.foreground-alt}
label = %percentage_used%%

[module/root]
type = internal/fs
mount-0 = /
interval = 30
format-mounted-prefix = "DISK "
format-mounted-prefix-foreground = ${colors.foreground-alt}
label-mounted = %percentage_used%%

[module/volume]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.foreground-alt}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = MUTED
label-muted-foreground = ${colors.empty-fg}

[module/backlight]
type = internal/backlight
card = amdgpu_bl0
use-actual-brightness = true
format-prefix = "BL "
format-prefix-foreground = ${colors.foreground-alt}
label = %percentage%%
